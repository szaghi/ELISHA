name = "ELISHA"
version = "0.0.0"
license = "GPL-3.0-or-later OR BSD-2-Clause OR BSD-3-Clause OR MIT"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@gmail.com"
copyright = "Copyright 2026 Stefano Zaghi"
homepage = "https://github.com/szaghi/ELISHA"
description = "Elliptic Laplacian Inversion: Spectral and Hierarchical Algorithms: FFT and AMR multigrid Poisson solvers for HPC"

[dependencies]
PENF = { git="https://github.com/szaghi/PENF.git", branch="master" }

[library]
source-dir = "src/lib"

[build]
link = ["fftw3"]
auto-executables = false
auto-tests = false
auto-examples = false


[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# fpm builds the serial library (no MPI): the MPI builds are the fobos modes
[preprocess]
[preprocess.cpp]
macros = ["_FFTW", "ELISHA_NO_MPI"]

[install]
library = true

[[test]]
name = "elisha_test_kinds"
source-dir = "src/tests"
main = "elisha_test_kinds.F90"

[[test]]
name = "elisha_test_fftw"
source-dir = "src/tests"
main = "elisha_test_fftw.F90"
